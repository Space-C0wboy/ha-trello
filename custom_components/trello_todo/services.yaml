create_card:
  fields:
    entity_id:
      selector:
        entity:
          filter:
            integration: trello_todo
            domain: todo
    board:
      selector:
        text: {}
    list:
      selector:
        text: {}
    name:
      selector:
        text: {}
      required: true
    description:
      selector:
        text:
          multiline: true
    due:
      selector:
        text: {}
      example: 2026-10-20 or 2026-10-20 09:15
    labels:
      selector:
        text:
          multiple: true
    members:
      selector:
        text:
          multiple: true
    position:
      selector:
        select:
          options:
          - top
          - bottom
      default: bottom
copy_card:
  fields:
